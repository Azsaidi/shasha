name: iOS compile check

# Quick compile of the iOS app for the simulator (no signing), including VLC from CocoaPods,
# so code errors show up here before a Codemagic/TestFlight build.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-check.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Install VLC (CocoaPods)
        run: |
          cd ios && pod install --repo-update
      - name: Build for simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -workspace Shasha.xcworkspace -scheme Shasha \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          echo "Swift files compiled: $(grep -c 'SwiftCompile normal' build.log || true)"
          echo "---- errors ----"
          grep -E "error:" build.log | sort -u | head -80 || true
          echo "---- warnings in our code ----"
          grep -E "/ios/Shasha/.*warning:" build.log | sort -u | head -80 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          grep -q "BUILD SUCCEEDED" build.log
