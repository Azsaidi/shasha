name: iOS compile check

# Quick compile of the iOS app for the simulator (no signing, no VLC pod) so code errors
# show up here before a Codemagic/TestFlight build. VLC code is skipped via canImport.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-check.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Shasha.xcodeproj -scheme Shasha \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
