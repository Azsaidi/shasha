# Codemagic: builds the native iOS app in ios/ and ships it to TestFlight.
# (The Android APK is built by GitHub Actions; see .github/workflows/build.yml.)
#
# Uses the same setup as Mawaqity:
#   - App Store Connect integration named "Apps"
#   - variable group "ios_signing" with CERTIFICATE_PRIVATE_KEY
# One-time: create the app in App Store Connect with bundle ID com.azsaidi.shasha
# (the first run registers the bundle ID and signing files if they're missing).

workflows:
  ios-testflight:
    name: Shasha iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Apps"
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.azsaidi.shasha"
        XCODE_WORKSPACE: "ios/Shasha.xcworkspace"
        XCODE_SCHEME: "Shasha"
      # Pinned (not "latest") to avoid the busy machine pool for the newest Xcode.
      xcode: 26.4
      cocoapods: default
    triggering:
      events: []
    # Keep the VLC download between builds so it isn't fetched every time.
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Install VLC (CocoaPods)
        script: |
          set -uo pipefail
          cd ios
          # Codemagic machines sometimes can't look up host names. Retry, and if lookups are
          # failing, switch the machine to public DNS before trying again.
          for attempt in 1 2 3 4; do
            if pod install --repo-update; then exit 0; fi
            echo "pod install failed (attempt $attempt)"
            if ! nslookup download.videolan.org >/dev/null 2>&1; then
              echo "DNS lookups are failing: switching to public DNS"
              networksetup -listallnetworkservices | tail -n +2 | while read -r service; do
                sudo networksetup -setdnsservers "$service" 1.1.1.1 8.8.8.8 || true
              done
              sudo dscacheutil -flushcache || true
              sudo killall -HUP mDNSResponder || true
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Set version and build number
        script: |
          set -euo pipefail
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --project "ios/Shasha.xcodeproj" --verbose
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
